name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Core and CLI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo build
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      # The workspace's default members: core, core-ffi and cli. The desktop
      # app needs a GUI toolkit and has its own job below.
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

  desktop:
    name: Desktop app (windows-latest)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo build
        uses: Swatinem/rust-cache@v2
        with:
          key: desktop

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install UI dependencies
        run: npm ci

      - name: Type-check and build the UI
        run: npm run build

      - name: Clippy
        run: cargo clippy -p beam-desktop --all-targets -- -D warnings

      - name: Test
        run: cargo test -p beam-desktop

      - name: Build the installer (.msi)
        run: npm run tauri build -- --ci --bundles msi

      - uses: actions/upload-artifact@v4
        with:
          name: beam-windows-msi
          path: target/release/bundle/msi/*.msi
          if-no-files-found: error
