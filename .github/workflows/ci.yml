name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Core and CLI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo build
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      # The workspace's default members: core, core-ffi and cli. The desktop
      # app needs a GUI toolkit and has its own job below.
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

  desktop:
    name: Desktop app (windows-latest)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo build
        uses: Swatinem/rust-cache@v2
        with:
          key: desktop

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install UI dependencies
        run: npm ci

      - name: Type-check and build the UI
        run: npm run build

      - name: Clippy
        run: cargo clippy -p beam-desktop --all-targets -- -D warnings

      - name: Test
        run: cargo test -p beam-desktop

      - name: Build the installer (.msi)
        run: npm run tauri build -- --ci --bundles msi

      - uses: actions/upload-artifact@v4
        with:
          name: beam-windows-msi
          path: target/release/bundle/msi/*.msi
          if-no-files-found: error

      # Placeholder identity: checks the Store package still builds. The
      # real one is packed with the Partner Center identity (msix/README.md).
      - name: Package for the Microsoft Store (.msix)
        shell: pwsh
        run: ./msix/build-msix.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: beam-windows-msix
          path: target/msix/*.msix
          if-no-files-found: error

  android:
    name: Android app (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android

      - name: Cache Cargo build
        uses: Swatinem/rust-cache@v2
        with:
          key: android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Install the NDK and SDK platform
        run: >
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install
          "ndk;30.0.16248370" "platforms;android-37.0" "build-tools;37.0.0" > /dev/null

      # Builds libbeam_core_ffi.so for all three ABIs, generates the Kotlin
      # bindings, then the app; runs the JVM tests and lint, and compiles
      # the instrumented tests (running those needs a device).
      - name: Build and test
        working-directory: android
        run: ./gradlew assembleDebug testDebugUnitTest assembleDebugAndroidTest lintDebug --console=plain

      - uses: actions/upload-artifact@v4
        with:
          name: beam-android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  # Every green build of main replaces the files on the "latest"
  # pre-release, so testers get a plain .apk and .msi (artifacts are
  # always zipped) from links that never change:
  # https://github.com/<repo>/releases/download/latest/Beam.apk
  publish:
    name: Publish the latest build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [rust, desktop, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: beam-*
          path: artifacts

      - name: Name the files
        run: |
          cp artifacts/beam-android-debug-apk/*.apk Beam.apk
          cp artifacts/beam-windows-msi/*.msi Beam.msi

      - name: Update the "latest" release
        run: |
          if gh release view latest > /dev/null 2>&1; then
            gh api -X PATCH "repos/$GH_REPO/git/refs/tags/latest" -f sha="$GITHUB_SHA" -F force=true > /dev/null
          else
            gh release create latest --prerelease --target "$GITHUB_SHA" --title "Latest build" --notes "Building…"
          fi
          gh release upload latest Beam.apk Beam.msi --clobber
          gh release edit latest --notes "The newest build of main ($GITHUB_SHA), replaced on every push.

          - **Beam.apk**: Android 10 or later. Open it on the phone to install.
          - **Beam.msi**: Windows installer. Not signed yet, so Windows may warn before installing; the Microsoft Store version won't."
