[workspace]
resolver = "2"
members = ["core", "core-ffi", "cli", "desktop/src-tauri"]
# The desktop app needs WebView2 / GTK system libraries, so plain `cargo build`
# and `cargo test` at the root skip it; build it with `npm run tauri` in desktop/.
default-members = ["core", "core-ffi", "cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/kartikay633/Beam"

[workspace.dependencies]
beam-core = { path = "core" }

# Optimize dependencies (blake3, tokio, ...) even in debug and test builds, so
# tests that move hundreds of MB finish in seconds. Our own crates stay quick
# to compile.
[profile.dev.package."*"]
opt-level = 3
