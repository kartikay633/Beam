org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official
# Which ABIs to build the Rust library for (comma-separated). CI and release
# builds use all three; set e.g. beam.abis=arm64-v8a locally for faster builds.
beam.abis=arm64-v8a,armeabi-v7a,x86_64
