[package]
name = "beam-cli"
description = "Send, receive and discover Beam devices from a terminal"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "beam-cli"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
beam-core.workspace = true
clap = { version = "4.6.7", features = ["derive"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net"] }
uuid = { version = "1.29.0", features = ["v4"] }
