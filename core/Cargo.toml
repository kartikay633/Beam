[package]
name = "beam-core"
description = "Beam protocol, crypto, transfer engine, resume and discovery"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
blake3 = "1.8.7"
ciborium = "0.2.2"
hex = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_bytes = "0.11.19"
serde_json = "1.0.154"
sha2 = "0.11.1"
snow = "0.10.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["net", "io-util", "fs", "rt", "macros", "time", "sync"] }
uuid = { version = "1.29.0", features = ["v4", "serde"] }

[dev-dependencies]
proptest = "1.12.0"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "test-util"] }
