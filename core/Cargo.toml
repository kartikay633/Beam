[package]
name = "beam-core"
description = "Beam protocol, crypto, transfer engine, resume and discovery"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
blake3 = { version = "1.8.7", features = ["mmap", "rayon"] }
chacha20poly1305 = "0.10.1"
ciborium = "0.2.2"
getrandom = "0.3.4"
hex = "0.4.3"
hkdf = "0.13"
if-addrs = "0.15.0"
mdns-sd = "0.21.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_bytes = "0.11.19"
serde_json = "1.0.154"
sha2 = "0.11.1"
snow = "0.10.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["net", "io-util", "fs", "rt", "macros", "time", "sync"] }
uuid = { version = "1.29.0", features = ["v4", "serde"] }
x25519-dalek = { version = "2.0.1", features = ["static_secrets"] }

[dev-dependencies]
proptest = "1.12.0"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "test-util"] }
